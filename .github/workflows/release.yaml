name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@v1
    with:
      approvers: "alexandraabbas jjallaire dragonstyle"
    secrets: inherit

  # Publish stays in-repo (PyPI trusted publishing can't run from a cross-repo
  # reusable workflow; keeping it here leaves the trusted-publisher config for
  # workflow release.yaml unchanged).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-sandboxes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Display version
        run: |
          echo "Version: $(git describe --tags --always)"
      - name: Install dependencies
        run: |
          pip install --upgrade pip build
      - name: Build package
        run: |
          python -m build
      - name: List built packages
        run: ls -lh dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
