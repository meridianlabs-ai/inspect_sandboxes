[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "inspect_sandboxes"
dynamic = ["version"]
description = "Collection of sandboxes for Inspect AI"
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
dependencies = [
    "daytona>=0.201.0",
    "e2b>=2.20",
    "inspect-ai>=0.3.211",
    "modal>=1.5.0",
    "tenacity>=9.1.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_sandboxes"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_sandboxes/issues"
Documentation = "https://meridianlabs-ai.github.io/inspect_sandboxes/"

[project.entry-points.inspect_ai]
inspect_sandboxes = "inspect_sandboxes._registry"

[project.optional-dependencies]
dev = [
    # The conformance suites consume inspect_ai's pytest-collected checks
    "inspect-ai>=0.3.261",
    "mypy>=1.19.1",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # tests/test_workflows.py and tests/test_dependency_cooldown.py read the
    # workflows
    "pyyaml",
    "ruff",
    "types-PyYAML",
]

# Not installed by default, so a plain `uv sync` or `uv run` leaves it out:
# quarto-cli has no wheel and is built from its sdist. Docs commands ask for it
# with `--extra doc`.
doc = [
    "griffe>=2",
    "jupyter",
    "markdown",
    "panflute",
    "pyyaml",
    "quarto-cli>=1.9",
    "rich",
]

[dependency-groups]
# Keeps a plain `uv sync` or `uv run` (Makefile) pulling the dev tools.
dev = ["inspect_sandboxes[dev]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_sandboxes/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]

[tool.uv]
managed = true
add-bounds = "lower"
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# 6 hours only for direct dependencies that are a sandbox provider SDK, and no
# cooldown (false) for Inspect's own packages; see CONTRIBUTING.md. Not daytona:
# it pins its daytona-* client packages to its own version, and they keep the
# 7-day cooldown.
[tool.uv.exclude-newer-package]
e2b = "6 hours"
inspect-ai = false
modal = "6 hours"

[tool.mypy]
ignore_missing_imports = false
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "modal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "daytona.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "e2b.*"
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
reportUnknownParameterType = true

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__
    "D212", # multi-line docstring summary should start at the first line
    "D415", # first line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]  # missing docstring in public function

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
relative_files = true
# hatch-vcs writes this at install time and it is gitignored, so the
# `coverage` job in build.yaml (a bare checkout, nothing installed) has no
# source for it and `coverage json` fails.
omit = ["src/inspect_sandboxes/_version.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require real Modal/Daytona/E2B resources (run with '-m integration')",
]
